name: Check

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JS sintaksisi (node --check)
        run: |
          set -e
          failed=0
          total=0
          for f in *.js; do
            total=$((total + 1))
            if ! node --check "$f"; then
              echo "::error file=$f::JS sintaksisi xato: $f"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "JS sintaksisi tekshiruvi fail bo'ldi."
            exit 1
          fi
          echo "OK: $total ta .js fayli node --check dan o'tdi"

      - name: i18n simmetriyasi (uz / ru / en)
        run: |
          set -e
          node -e '
          const fs = require("fs");
          const vm = require("vm");
          const sandbox = { window: {}, console: console };
          vm.createContext(sandbox);
          vm.runInContext(fs.readFileSync("i18n.js", "utf8"), sandbox, { filename: "i18n.js" });
          const dict = sandbox.window.I18N && sandbox.window.I18N.dict;
          if (!dict) {
            console.error("::error file=i18n.js::I18N.dict topilmadi");
            process.exit(1);
          }
          const langs = ["uz", "ru", "en"];
          const keys = {};
          langs.forEach(function (l) { keys[l] = new Set(Object.keys(dict[l] || {})); });
          const issues = [];
          langs.forEach(function (l) {
            if (keys[l].size === 0) issues.push("i18n." + l + " qismi bosh");
          });
          langs.forEach(function (l) {
            langs.forEach(function (o) {
              if (l === o) return;
              keys[l].forEach(function (k) {
                if (!keys[o].has(k)) issues.push(k + ": " + l + " da bor, " + o + " da mavjud emas");
              });
            });
          });
          console.log("i18n kalitlari: " + langs.map(function (l) { return l + "=" + keys[l].size; }).join(", "));
          if (issues.length) {
            issues.forEach(function (m) { console.error("::error file=i18n.js::" + m); });
            console.error("i18n simmetriyasi buzuldi: " + issues.length + " ta muammo");
            process.exit(1);
          }
          console.log("OK: i18n uz/ru/en kalitlari teng va tola");
          '

      - name: Dataset integrity (config / commands / synonyms / labs)
        run: |
          set -e
          node -e '
          const fs = require("fs");
          const vm = require("vm");
          function load(file) {
            const sandbox = { window: {}, console: console };
            vm.createContext(sandbox);
            vm.runInContext(fs.readFileSync(file, "utf8"), sandbox, { filename: file });
            return sandbox.window;
          }
          const issues = [];
          const counts = {};
          const langKeys = ["uz", "ru", "en"];

          const config = load("site.config.js").SITE_CONFIG;
          if (!config) issues.push("site.config.js: SITE_CONFIG topilmadi");
          else ["brand", "channel", "description"].forEach(function (k) {
            if (!config[k]) issues.push("site.config.js: " + k + " mavjud emas");
          });

          const data = load("commands.js");
          const cats = data.CATEGORIES || [];
          const cmds = data.LINUX_COMMANDS || [];
          counts.categories = cats.length;
          counts.commands = cmds.length;
          counts.examples = cmds.reduce(function (n, c) { return n + (c.examples || []).length; }, 0);
          counts.options = cmds.reduce(function (n, c) { return n + (c.options || []).length; }, 0);
          if (!cats.length) issues.push("CATEGORIES bosh");
          if (!cmds.length) issues.push("LINUX_COMMANDS bosh");
          if (!counts.examples) issues.push("Misollar (examples) topilmadi");
          const catIds = {};
          cats.forEach(function (c) {
            if (!c.id) issues.push("Kategoriyada id mavjud emas");
            if (catIds[c.id]) issues.push("Kategoriya id takrorlangan: " + c.id);
            catIds[c.id] = true;
            langKeys.forEach(function (l) { if (!c[l]) issues.push("Kategoriya " + c.id + ": " + l + " mavjud emas"); });
          });
          const seen = {};
          cmds.forEach(function (c) {
            if (!c.id || !c.name) issues.push("Buyruqda id yoki name mavjud emas: " + (c.name || "?"));
            if (seen[c.id]) issues.push("Buyruq id takrorlangan: " + c.id);
            seen[c.id] = true;
            if (c.category && !catIds[c.category]) issues.push("Buyruq " + c.id + ": kategoriya " + c.category + " topilmadi");
            langKeys.forEach(function (l) { if (!c.desc || !c.desc[l]) issues.push("Buyruq " + c.id + ": desc." + l + " mavjud emas"); });
            (c.options || []).forEach(function (o, i) {
              langKeys.forEach(function (l) { if (!o[l]) issues.push("Buyruq " + c.id + ": option[" + i + "]." + l + " mavjud emas"); });
            });
            (c.examples || []).forEach(function (e, i) {
              if (!e.cmd) issues.push("Buyruq " + c.id + ": example[" + i + "].cmd mavjud emas");
              langKeys.forEach(function (l) { if (!e[l]) issues.push("Buyruq " + c.id + ": example[" + i + "]." + l + " mavjud emas"); });
            });
          });

          const syn = load("synonyms.js");
          counts.aliases = 0;
          ["COMMAND_SYNONYMS", "SEARCH_SYNONYMS"].forEach(function (name) {
            const group = syn[name] || {};
            if (!Object.keys(group).length) issues.push("synonyms.js: " + name + " bosh");
            Object.keys(group).forEach(function (k) {
              const list = group[k];
              if (!Array.isArray(list) || !list.length) issues.push("Synonym " + name + "." + k + ": alias royxati bosh");
              else list.forEach(function (a, i) {
                if (typeof a !== "string" || !a.trim()) issues.push("Synonym " + name + "." + k + "[" + i + "]: bosh alias");
                else counts.aliases++;
              });
            });
          });

          if (fs.existsSync("labs.js")) {
            const labsData = load("labs.js");
            const key = Object.keys(labsData).filter(function (k) { return Array.isArray(labsData[k]); })[0];
            if (!key) issues.push("labs.js: lab massivi topilmadi");
            else {
              const labs = labsData[key];
              counts.labs = labs.length;
              if (!labs.length) issues.push("labs.js: " + key + " bosh");
              labs.forEach(function (l, i) {
                langKeys.forEach(function (lang) {
                  const direct = l[lang];
                  const nested = l.title && l.title[lang];
                  if (!direct && !nested) issues.push("Lab[" + i + "]: " + lang + " maydoni mavjud emas");
                });
              });
            }
          } else {
            console.log("::warning::labs.js hozircha mavjud emas — lab tekshiruvi otkazib yuborildi");
            counts.labs = "skip";
          }

          console.log("Dataset sonlari: " + JSON.stringify(counts));
          if (issues.length) {
            issues.forEach(function (m) { console.error("::error::" + m); });
            console.error("Dataset integrity buzuldi: " + issues.length + " ta muammo");
            process.exit(1);
          }
          console.log("OK: dataset integrity");
          '

      - name: Taqiqlangan satrlar mavjud emas
        run: |
          set -e
          if grep -InE "kalilinux_uz|javascript:alert" -- *.js *.html *.css *.webmanifest; then
            echo "::error::Taqiqlangan satr topildi: kalilinux_uz yoki javascript:alert"
            exit 1
          fi
          echo "OK: taqiqlangan satrlar mavjud emas"

      - name: HTML fayllarda manifest havolasi
        run: |
          set -e
          failed=0
          total=0
          for f in *.html; do
            total=$((total + 1))
            if ! grep -q "manifest.webmanifest" "$f"; then
              echo "::error file=$f::$f faylida manifest.webmanifest havolasi mavjud emas"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Manifest havolasi tekshiruvi fail bo'ldi."
            exit 1
          fi
          echo "OK: $total ta HTML faylida manifest.webmanifest bor"

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: npm run test:e2e

      - name: Lighthouse CI
        run: npm run lighthouse
