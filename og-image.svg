<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Kali Linux — buyruqlar, laboratoriya, test</title>
  <desc id="desc">LinuxCoreX loyihasining ijtimoiy tarmoqlar uchun qalqib chiquvchi kartasi</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="0.55" stop-color="#050505"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d2d"/>
      <stop offset="0.5" stop-color="#e10600"/>
      <stop offset="1" stop-color="#8b0000"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff1a1a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff1a1a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <path d="M0 0 H1200 V190 C900 250 300 210 0 300 Z" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="8" fill="url(#red)"/>
  <rect x="72" y="76" width="72" height="6" rx="3" fill="url(#red)"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#ffffff">
    <text x="72" y="168" font-size="24" font-weight="700" letter-spacing="6" fill="#ff4d4d">KALI LINUX</text>
    <text x="72" y="330" font-size="122" font-weight="900" letter-spacing="-3">KALI</text>
    <text x="72" y="438" font-size="122" font-weight="900" letter-spacing="-3" fill="url(#red)">LINUX</text>
    <text x="76" y="512" font-size="31" font-weight="700" letter-spacing="2">BUYRUKLAR · LAB · TEST</text>
    <text x="76" y="568" font-size="25" font-weight="600" letter-spacing="1" fill="#b9b9b9">@LinuxCoreX</text>
  </g>

  <g opacity="0.75">
    <rect x="1000" y="96" width="128" height="128" rx="22" fill="#111111" stroke="#ff2d2d" stroke-width="3"/>
    <text x="1064" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="900" fill="#ff3b3b">&gt;_</text>
  </g>
  <rect x="72" y="600" width="1056" height="2" fill="#ffffff" fill-opacity="0.08"/>
</svg>
